name: Update market data

on:
  schedule:
    # every 20 min, ~8:30 AM to 4:00 PM IST, Mon-Fri
    - cron: "*/20 3-10 * * 1-5"
    # once after NSE publishes FII/DII (~7 PM IST)
    - cron: "30 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch data
        run: python fetch_data.py
      - name: Commit data.json
        run: |
          git config user.name "market-bot"
          git config user.email "market-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "data update" && git push)
   
